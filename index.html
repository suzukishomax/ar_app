<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AR Text Base</title>

    <!-- フレームワーク層（MIT / npm から public/external にコピー） -->
    <script src="./external/xrextras/xrextras.js"></script>
    <script src="./external/landing-page/landing-page.js"></script>

    <!-- SLAM エンジン層（非公開バイナリ / jsDelivr からバージョン固定で取得） -->
    <script
      async
      crossorigin="anonymous"
      data-preload-chunks="slam"
      src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js"
    ></script>

    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="camerafeed"></canvas>

    <div id="ui">
      <p id="hint">床・机・壁をタップすると文字を置けます</p>
      <form id="note-form" autocomplete="off">
        <input id="note-text" type="text" maxlength="40" value="Hello AR" placeholder="置きたい文字" />
        <button type="button" id="btn-undo" title="ひとつ戻す">↶</button>
        <button type="button" id="btn-clear" title="全部消す">✕</button>
      </form>
      <p id="credit">AR: 8th Wall Engine © Niantic Spatial, Inc.</p>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
