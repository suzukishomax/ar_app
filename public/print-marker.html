<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マーカー印刷</title>
    <style>
      @page { size: A4 portrait; margin: 0; }
      body { margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; }
      .page { width: 210mm; height: 297mm; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8mm; }
      img { width: 120mm; height: 160mm; display: block; }
      p { margin: 0; font-size: 10pt; color: #555; text-align: center; line-height: 1.6; }
      @media screen { body { background: #ddd; } .page { background: #fff; margin: 16px auto; box-shadow: 0 2px 12px #0003; } }
      @media print { .noprint { display: none; } }
      .noprint { text-align: center; margin: 16px; }
      button { font-size: 16px; padding: 10px 24px; }
    </style>
  </head>
  <body>
    <div class="noprint">
      <button onclick="print()">印刷する</button>
      <p>印刷設定は「A4・倍率100%（実際のサイズ）」にしてください</p>
    </div>
    <div class="page">
      <img src="./image-targets/desk-a_original.png" alt="DESK A マーカー" />
      <p>AR マーカー: desk-a（120 × 160 mm）<br />平らな場所に貼る・折り目やテカリを避ける</p>
    </div>
  </body>
</html>
